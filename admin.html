<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>GRAVITY_OS · AI Product Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1016; --panel:#171a22; --panel-2:#1e222c; --line:#2a2f3b;
    --text:#e8eaf0; --text-dim:#8a90a0; --text-faint:#565c6c;
    --amber:#e8a33d; --teal:#4fd1c5; --red:#e2604f;
    --radius:14px; font-size:16px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; padding:28px 18px 90px;
    background-image: radial-gradient(circle at 88% 6%, rgba(232,163,61,0.05), transparent 42%);
  }
  .wrap{ max-width:680px; margin:0 auto; }
  button{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; border-radius:8px;
    border:none; cursor:pointer; padding:13px 20px; transition:filter .15s; }
  .btn-primary{ background:var(--amber); color:#1a1206; width:100%; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-teal{ background:var(--teal); color:#062421; width:100%; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); font-weight:500; font-size:13px; padding:10px 14px; }
  input[type=text]{ width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:7px; padding:12px 14px; font-size:14.5px; font-family:'Inter',sans-serif; margin-bottom:12px; }
  .tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--panel-2); color:var(--text-faint); }
  .err{ color:#f0b3a8; font-size:13px; margin-top:10px; display:none; white-space:pre-wrap; }
  .hidden{ display:none !important; }
  .tl-card{ flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:14px; }
  .tl-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .tl-card-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; }
  .tl-card-sub{ color:var(--text-dim); font-size:12.5px; margin-bottom:2px; }
  .tl-card-body{ margin-top:10px; }
  .pv-check-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:12.5px; padding:4px 0; color:var(--text-dim); }
  .pv-check-row .ico{ flex-shrink:0; width:14px; font-weight:700; }
  .pv-check-row.ok .ico{ color:var(--teal); }
  .pv-check-row.warn .ico{ color:var(--amber); }
  .pv-check-row.error .ico{ color:var(--red); }

  /* ─── Demand score card (NEW) ─── */
  .demand-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-top:4px; }
  .demand-card.ok{ border-color:rgba(79,209,197,0.35); }
  .demand-card.warn{ border-color:rgba(232,163,61,0.35); }
  .demand-card.error{ border-color:rgba(226,96,79,0.35); }
  .demand-score-row{ display:flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; margin-bottom:8px; }
  .demand-score-row .demand-num.ok{ color:var(--teal); }
  .demand-score-row .demand-num.warn{ color:var(--amber); }
  .demand-score-row .demand-num.error{ color:var(--red); }
  .demand-reasons{ display:flex; flex-direction:column; gap:4px; }
  .demand-reason-row{ display:flex; align-items:flex-start; gap:7px; font-size:12.5px; color:var(--text-dim); }
  .demand-reason-row .ico{ flex-shrink:0; width:14px; }
  .demand-reason-row.pass .ico{ color:var(--teal); }
  .demand-reason-row.fail .ico{ color:var(--amber); }
</style>
</head>
<body>

<div class="wrap">
  <div class="tl-card-head" style="margin-bottom:16px; align-items:flex-start;">
    <span class="tl-card-title" id="ovName" style="font-size:15px;">ยังไม่มีสินค้า</span>
    <span class="tag" id="ovTag">ยังไม่เริ่ม</span>
  </div>

  <!-- 1. Import -->
  <div class="tl-card" id="panel-import">
    <div class="tl-card-head">
      <span class="tl-card-title">Import Product <span class="tag" id="md-selected-chip" style="display:none; margin-left:6px;"></span></span>
    </div>
    <div class="tl-card-sub" id="psub-import">วาง URL สินค้าหรือพิมพ์รายละเอียด</div>
    <div class="tl-card-body">
      <input type="text" id="in" placeholder="วาง URL สินค้า หรือพิมพ์รายละเอียด...">
      <button class="btn-primary" id="importBtn" onclick="doImport()">Import</button>
      <div class="err" id="importErr"></div>

      <!--
        GRAVITY FIX (2026-09-08): Demand Score card.
        แสดงทันทีหลัง Import สำเร็จ ก่อนไปกด "Generate Everything" — ใช้แค่
        ข้อมูลที่ scrape มาตอน Import (checkDemandSignal ไม่ต้องรอ AI เนื้อหา
        ก่อน) เรียก /api/demand-check ผ่าน checkDemandAfterImport()
        ซึ่งถูกเรียกต่อจาก doImport() (ดูใน <script> ด้านล่าง)
      -->
      <div id="demandCard" class="hidden" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- 2. Generate -->
  <div class="tl-card" id="panel-generate">
    <div class="tl-card-head">
      <span class="tl-card-title">Generate Everything</span>
      <span class="tag" id="statusTag"></span>
    </div>
    <div class="tl-card-sub" id="psub-generate">รอนำเข้าสินค้าก่อน</div>
    <div class="tl-card-body">
      <div id="pipelineStatusBanner" class="pv-check-row warn hidden" style="background:var(--panel-2); border:1px solid rgba(232,163,61,0.35); border-radius:8px; padding:10px 12px; margin-bottom:12px;"></div>
      <button class="btn-primary" id="generateBtn" onclick="runGenerateAll()">Generate Everything</button>
      <div class="err" id="generateErr"></div>
    </div>
  </div>
</div>

<script>
const API = 'https://af.pakpiromjajaja.workers.dev';
let productId = null;
let latestPipelineStatus = null;
let latestPipelineError = '';

function showErr(id, msg){ const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }
function hideErr(id){ document.getElementById(id).style.display = 'none'; }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function apiCall(path, options, label){
  const res = await fetch(API + path, options);
  const data = await res.json();
  if (data.error) {
    const err = new Error(data.error);
    err.data = data;
    throw err;
  }
  return data;
}

/*
 * GRAVITY FIX (2026-09-08): checkDemandAfterImport()
 * -----------------------------------------------------------------
 * เรียก /api/demand-check ทันทีหลัง Import สำเร็จ (ไม่เสีย AI call เลย
 * เพราะ checkDemandSignal ใช้แค่ rating/reviewCount/affiliateRate/price
 * ที่ scrape มาตอน Import) แล้ว render เป็นการ์ดใต้ปุ่ม Import — ให้เห็น
 * demand score ก่อนตัดสินใจกด Generate Everything (8 steps ของ AI)
 *
 * data.available === false  -> ข้อมูลไม่ครบ (เช่น scrape ไม่ได้ rating)
 *   ซ่อนการ์ดไปเงียบๆ ไม่บล็อกอะไร (fail-open เหมือนฝั่ง backend)
 * data.available === true   -> โชว์ score, recommendation, และ reasons
 *   แต่ละข้อ (pass/fail) ตรงจาก demand.reasons ที่ checkDemandSignal คืนมา
 */
async function checkDemandAfterImport(){
  const el = document.getElementById('demandCard');
  if (!el || !productId) return;
  el.classList.add('hidden');
  el.innerHTML = '';
  try{
    const data = await apiCall('/api/demand-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ productId })
    }, 'POST /api/demand-check');

    if (!data.available) return; // ข้อมูลไม่ครบพอจะเช็ค — ไม่บล็อก ไม่ต้องโชว์อะไร

    const d = data.demand;
    const cls = d.score >= 60 ? 'ok' : d.score >= 40 ? 'warn' : 'error';
    const icon = cls === 'ok' ? '🟢' : cls === 'warn' ? '🟡' : '🔴';

    const reasonsHtml = (d.reasons || []).map(r => {
      const pass = /^✓/.test(r) || /ok$/i.test(r);
      return '<div class="demand-reason-row ' + (pass ? 'pass' : 'fail') + '">' +
        '<span class="ico">' + (pass ? '✓' : '✗') + '</span><span>' + escapeHtml(r.replace(/^[✓✗]\s*/, '')) + '</span></div>';
    }).join('');

    el.innerHTML =
      '<div class="demand-card ' + cls + '">' +
        '<div class="demand-score-row">' + icon + ' <span>Demand Score:</span> <span class="demand-num ' + cls + '">' + d.score + '/100</span></div>' +
        '<div class="pv-check-row ' + (cls === 'ok' ? 'ok' : cls === 'warn' ? 'warn' : 'error') + '" style="padding:0 0 8px;">' +
          '<span class="ico">' + (cls === 'ok' ? '✓' : '!') + '</span><span>' + escapeHtml(d.recommendation || '') + '</span>' +
        '</div>' +
        (reasonsHtml ? '<div class="demand-reasons">' + reasonsHtml + '</div>' : '') +
      '</div>';
    el.classList.remove('hidden');
  }catch(e){
    // เช็คไม่สำเร็จ — ข้ามเงียบๆ ไม่บล็อก flow การ import/generate เดิม
    el.classList.add('hidden');
  }
}

async function doImport(){
  const btn = document.getElementById('importBtn');
  const val = document.getElementById('in').value.trim();
  hideErr('importErr');
  if(!val){ showErr('importErr', 'ใส่ลิงก์หรือรายละเอียดก่อนครับ'); return; }
  btn.disabled = true; btn.textContent = 'กำลังนำเข้า...';
  try{
    const data = await apiCall('/api/import', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ input: val })
    }, 'POST /api/import');
    productId = data.productId;

    latestPipelineStatus = data.pipeline.status;
    updateStatusTag(data.pipeline.status);
    document.getElementById('in').value = '';

    // ─── เรียก demand check ทันทีหลัง import สำเร็จ ───
    await checkDemandAfterImport();

  }catch(e){
    showErr('importErr', e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Import';
  }
}

function updateStatusTag(status){
  const tag = document.getElementById('statusTag');
  tag.className = 'tag ' + status;
  tag.textContent = status.toUpperCase();
}

async function runGenerateAll(){
  const btn = document.getElementById('generateBtn');
  hideErr('generateErr');
  btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
  try{
    let done = false;
    while(!done){
      const data = await apiCall('/api/enrich', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ productId })
      }, 'POST /api/enrich');
      done = data.done;
      if (data.step) btn.textContent = 'กำลังสร้าง: ' + data.step.label + '...';
    }
    btn.textContent = 'เสร็จแล้ว ✓';
  }catch(e){
    showErr('generateErr', e.message);
    btn.textContent = 'ลองอีกครั้ง';
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('in').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doImport();
});
</script>

</body>
</html>
