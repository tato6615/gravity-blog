name: Agent Tick (Control Agent Heartbeat)

# Cloudflare Pages Functions have no native cron trigger, so scheduling
# lives here instead — same pattern this repo already uses for
# check-buy-url-health.yml and sync-reddit-queue.yml.
#
# Tightened from hourly to every 10 minutes (Step 3 slice 3): the
# opportunity→audience→offer→content→media→distribution chain is now
# fully implemented and cooldown-exempt (see tick.js's QUEUE_DRIVEN_AGENT_IDS),
# so it's bounded only by how often this workflow actually calls /api/agents/tick,
# not by any per-agent cooldown. REPORT agents (market/revenue/traffic/
# conversion/experiment/growth) still self-throttle via TICK_COOLDOWN_MINUTES
# inside tick.js, so calling this more often does not spam them — it just lets
# the money-making pipeline drain its queue and react to new tasks within
# minutes instead of waiting up to an hour.
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch: {}       # allow manual trigger from the Actions tab too

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/agents/tick
        run: |
          curl -sf -X POST https://gravity-blog.pages.dev/api/agents/tick \
            -H "content-type: application/json" \
            -w "\nHTTP %{http_code}\n"
