name: Sync Analytics to Grist
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Debug - list repo root and scripts folder
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== SCRIPTS FOLDER ==="
          ls -la scripts/
          echo "=== EXACT FILE CHECK ==="
          test -f scripts/sync-analytics-to-grist.js && echo "FOUND" || echo "NOT FOUND"
      - name: Sync D1 -> Grist AI_ANALYTICS
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/sync-analytics-to-grist.js --sync
