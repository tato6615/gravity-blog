name: Sync GA4 Views to Grist

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-ga4-views-to-grist.js'
  schedule:
    - cron: '0 * * * *'   # ทุกชั่วโมง (เหมือน check-product-links และ sync-analytics)
  workflow_dispatch:       # กดรันเองจากแท็บ Actions บน GitHub ได้ด้วย

jobs:
  sync-ga4-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync GA4 views into Grist
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: node scripts/sync-ga4-views-to-grist.js --sync
